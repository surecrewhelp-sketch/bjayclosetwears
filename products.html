<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — B'JAY CLOSET</title>
<meta name="description" content="Shop women's wear, men's wear, shoes and bags at B'JAY CLOSET. Order on WhatsApp for fast delivery in Abuja." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=7" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo" data-logo>B'JAY <span>CLOSET</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/products" class="active">Products</a>
      <a href="/contact">Contact</a>
    </nav>

    <a href="#" class="btn btn-whatsapp header-cta" data-whatsapp-link target="_blank" rel="noopener">
      <span class="wa-icon">●</span> WhatsApp Us
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>

  <section class="page-header">
    <div class="container">
      <p class="eyebrow">Shop The Closet</p>
      <h1>Our Products</h1>
      <p class="page-header-sub">Women's wear, men's wear, shoes and bags — all in one place.</p>
    </div>
  </section>

  <section class="products">
    <div class="container">
      <div class="toolbar">
        <div class="filter-bar" id="filterBar">
          <button class="filter-chip active" data-category="All">All</button>
          <button class="filter-chip" data-category="Women">Women</button>
          <button class="filter-chip" data-category="Men">Men</button>
          <button class="filter-chip" data-category="Shoes">Shoes</button>
          <button class="filter-chip" data-category="Bags">Bags</button>
        </div>

        <div class="toolbar-controls">
          <input type="search" id="searchInput" class="search-input" placeholder="Search products..." aria-label="Search products" />
          <select id="sortSelect" class="sort-select" aria-label="Sort products">
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
          </select>
        </div>
      </div>

      <p class="result-count" id="resultCount"></p>

      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <div class="logo footer-logo" data-logo>B'JAY <span>CLOSET</span></div>
      <p data-address>FCT Abuja, Nigeria</p>
    </div>
    <div class="footer-links">
      <a href="#" data-whatsapp-link target="_blank" rel="noopener">WhatsApp</a>
      <a href="#" data-instagram-link target="_blank" rel="noopener">Instagram</a>
      <a href="#" data-email-link>Email</a>
    </div>
    <p class="footer-copy">&copy; <span data-year></span> <span data-brand-name>B'JAY CLOSET</span>. All rights reserved.</p>
  </div>
</footer>
